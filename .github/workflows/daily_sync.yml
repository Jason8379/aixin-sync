name: 爱心事业云端自动抓取同步

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 6:00（周三~周日），对应 UTC 时间 22:00（周二~周六）
    - cron: '0 22 * * 2-6'

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 运行爬虫
        run: python auto_crawler.py

      - name: 提交数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "自动更新数据 $(date '+%Y-%m-%d %H:%M')"
          git push origin main
