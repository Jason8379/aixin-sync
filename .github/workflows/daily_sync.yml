name: 爱心事业云端自动抓取同步

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动同步

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps  # 关键：自动安装 Playwright 无头浏览器

      - name: 运行真实遍历爬虫抓取全量数据
        env:
          OLD_SYS_USER: ${{ secrets.OLD_SYS_USER }}
          OLD_SYS_PWD: ${{ secrets.OLD_SYS_PWD }}
        run: |
          python auto_crawler.py

      - name: 提交并推送全量数据到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update full team data with infinite scroll" || exit 0
          git push
