<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>团队订单数据</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 16px;
            color: #1e293b;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: 600; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            padding: 14px 12px;
            border-radius: 12px;
            border: 1px solid #e9edf2;
        }
        .stat-card .label { font-size: 13px; color: #94a3b8; font-weight: 500; }
        .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
        .stat-card .value .unit { font-size: 13px; font-weight: 400; color: #94a3b8; margin-left: 2px; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            align-items: center;
        }
        .toolbar input[type="date"] {
            padding: 8px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        .toolbar input[type="text"] {
            flex: 1 1 200px;
            padding: 8px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }
        .toolbar input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .toolbar .badge { background: #eef2f6; padding: 4px 12px; border-radius: 20px; font-size: 13px; color: #475569; }
        .table-wrap {
            background: white;
            border-radius: 12px;
            border: 1px solid #e9edf2;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 700px;
        }
        th {
            background: #f8fafc;
            text-align: left;
            padding: 12px 14px;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
        }
        tr:hover td { background: #fafbfc; }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.completed { background: #dcfce7; color: #166534; }
        .status-badge.pending { background: #fef9c3; color: #854d0e; }
        .status-badge.other { background: #f1f5f9; color: #475569; }
        .empty { text-align: center; padding: 40px 0; color: #94a3b8; }
        .daily-summary {
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e9edf2;
            padding: 16px;
        }
        .daily-summary h3 { font-size: 16px; margin-bottom: 12px; }
        .daily-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .daily-item {
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .daily-item:hover { background: #e2e8f0; }
        .daily-item .amount { font-weight: 600; color: #0f172a; margin-left: 4px; }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .update-time { font-weight: 400; color: #64748b; font-size: 14px; margin-left: 12px; }
        .text-muted { color: #64748b; font-size: 12px; }
        .highlight-profit { color: #059669; font-weight: 500; }
        .highlight-seller { color: #2563eb; font-weight: 600; }
        .highlight-buyer { color: #7c3aed; font-weight: 600; }
        .date-filter {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #e9edf2;
        }
        .date-filter label { font-weight: 500; color: #475569; }
        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .stat-card .value { font-size: 18px; }
            table { font-size: 12px; min-width: 500px; }
            th, td { padding: 6px 8px; }
            .date-filter { flex-wrap: wrap; }
        }
        .selected-date { background: #dbeafe; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
        <div>
            <h1>📊 团队订单数据</h1>
            <div class="subtitle">所有订单明细 · 自动同步 <span id="updateTime" class="update-time"></span></div>
        </div>
        <div style="font-size:13px; color:#64748b; background:#eef2f6; padding:4px 12px; border-radius:20px;">
            🟢 数据来自 data.json
        </div>
    </div>

    <!-- 日期筛选器 -->
    <div class="toolbar">
        <div class="date-filter">
            <label for="datePicker">📅 选择日期：</label>
            <input type="date" id="datePicker" />
            <button id="todayBtn" style="padding:6px 16px; border:1px solid #d1d9e6; border-radius:8px; background:white; cursor:pointer;">今天</button>
            <button id="allBtn" style="padding:6px 16px; border:1px solid #d1d9e6; border-radius:8px; background:white; cursor:pointer;">全部</button>
        </div>
        <input type="text" id="searchInput" placeholder="🔍 搜索 单号/卖家/买家..." style="flex:1; min-width:150px;" />
        <span class="badge" id="rowCount">0 条</span>
    </div>

    <!-- 汇总卡片 -->
    <div class="stats" id="statsContainer">
        <div class="stat-card"><div class="label">📦 总订单</div><div class="value" id="totalOrders">-</div></div>
        <div class="stat-card"><div class="label">💰 总收益</div><div class="value" id="totalProfit">-</div></div>
        <div class="stat-card"><div class="label">📤 总上架费</div><div class="value" id="totalFee">-</div></div>
        <div class="stat-card"><div class="label">💵 总交易额</div><div class="value" id="totalAmount">-</div></div>
        <div class="stat-card"><div class="label">👥 参与人数</div><div class="value" id="totalUsers">-</div></div>
        <div class="stat-card"><div class="label">🏦 已提现佣金</div><div class="value" id="commission">-</div></div>
    </div>

    <!-- 每日收益（点击可快速过滤） -->
    <div class="daily-summary">
        <h3>📅 每日收益（点击日期可筛选）</h3>
        <div class="daily-grid" id="dailyGrid">加载中...</div>
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th style="min-width:120px;">单号</th>
                    <th style="min-width:80px;">卖家</th>
                    <th style="min-width:80px;">买家</th>
                    <th style="min-width:70px;">价格</th>
                    <th style="min-width:70px;">收益</th>
                    <th style="min-width:70px;">上架费</th>
                    <th style="min-width:140px;">配单时间</th>
                    <th style="min-width:70px;">状态</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8" class="empty">加载数据中...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">数据每天自动同步 · 仅团队内部查看</div>
</div>

<script>
let allOrders = [];
let currentDate = null; // null表示全部

async function loadData() {
    try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error('无法获取数据');
        return await res.json();
    } catch (e) {
        console.error('加载失败:', e);
        return null;
    }
}

function fmt(n) { return Number(n).toFixed(2); }

function getTodayStr() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function render(data, selectedDate) {
    if (!data) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" class="empty">无法加载数据</td></tr>`;
        return;
    }

    let orders = [];
    let summary = {};

    if (Array.isArray(data)) {
        orders = data;
    } else if (data.orders) {
        orders = data.orders;
        summary = data.summary || {};
    } else {
        orders = [];
    }

    if (!Array.isArray(orders)) orders = [];

    // ★★★ 按配单时间降序排序（最新的在前）★★★
    orders = orders.sort((a, b) => {
        const timeA = a.配单时间 || '1970-01-01 00:00:00';
        const timeB = b.配单时间 || '1970-01-01 00:00:00';
        return timeB.localeCompare(timeA);
    });

    allOrders = orders; // 保存全量数据

    // 根据日期筛选
    let filteredOrders = orders;
    if (selectedDate) {
        filteredOrders = orders.filter(o => {
            const date = o.配单时间 ? o.配单时间.slice(0,10) : '';
            return date === selectedDate;
        });
    }

    // 统计（基于筛选后的数据）
    const totalOrders = filteredOrders.length;
    const totalProfit = filteredOrders.reduce((s, o) => s + Number(o.收益 || 0), 0);
    const totalFee = filteredOrders.reduce((s, o) => s + Number(o.上架费 || 0), 0);
    const totalAmount = filteredOrders.reduce((s, o) => s + Number(o.价格 || 0), 0);
    
    const users = new Set();
    filteredOrders.forEach(o => {
        if (o.卖家 && o.卖家.trim()) users.add(o.卖家.trim());
        if (o.买家 && o.买家.trim()) users.add(o.买家.trim());
    });

    document.getElementById('totalOrders').textContent = totalOrders;
    document.getElementById('totalProfit').innerHTML = fmt(totalProfit) + ' <span class="unit">元</span>';
    document.getElementById('totalFee').innerHTML = fmt(totalFee) + ' <span class="unit">元</span>';
    document.getElementById('totalAmount').innerHTML = fmt(totalAmount) + ' <span class="unit">元</span>';
    document.getElementById('totalUsers').textContent = users.size;
    
    const withdrawn = summary.已提现佣金 || 0;
    document.getElementById('commission').innerHTML = fmt(withdrawn) + ' <span class="unit">元</span>';
    
    document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');

    // 每日收益（全部数据，不受筛选影响）
    const daily = {};
    orders.forEach(o => {
        const date = o.配单时间 ? o.配单时间.slice(0,10) : '未知';
        if (!daily[date]) daily[date] = { profit: 0, count: 0 };
        daily[date].profit += Number(o.收益 || 0);
        daily[date].count += 1;
    });
    const grid = document.getElementById('dailyGrid');
    const dates = Object.keys(daily).sort().reverse();
    if (dates.length === 0) {
        grid.innerHTML = '<span style="color:#94a3b8;">暂无数据</span>';
    } else {
        grid.innerHTML = dates.map(d => {
            const isActive = (selectedDate === d);
            return `<span class="daily-item ${isActive ? 'selected-date' : ''}" data-date="${d}">
                ${d} <span class="amount">+${fmt(daily[d].profit)} (${daily[d].count}单)</span>
            </span>`;
        }).join('');
        // 绑定点击事件
        grid.querySelectorAll('.daily-item').forEach(el => {
            el.addEventListener('click', function() {
                const date = this.dataset.date;
                document.getElementById('datePicker').value = date;
                currentDate = date;
                render(data, date);
            });
        });
    }

    // 搜索过滤（基于当前筛选后的数据）
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    let displayOrders = filteredOrders;
    if (search) {
        displayOrders = filteredOrders.filter(o => {
            return (o.单号 || '').includes(search) ||
                   (o.卖家 || '').toLowerCase().includes(search) ||
                   (o.买家 || '').toLowerCase().includes(search);
        });
    }

    document.getElementById('rowCount').textContent = displayOrders.length + ' 条';

    const tbody = document.getElementById('tableBody');
    if (displayOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">没有匹配的订单</td></tr>`;
        return;
    }

    // 只显示前100条
    const slice = displayOrders.slice(0, 100);

    tbody.innerHTML = slice.map(o => {
        const st = o.状态 || '已完成';
        let cls = 'other';
        if (st.includes('完成')) cls = 'completed';
        else if (st.includes('待')) cls = 'pending';
        const seller = o.卖家 && o.卖家.trim() ? o.卖家 : '-';
        const buyer = o.买家 && o.买家.trim() ? o.买家 : '-';
        return `<tr>
            <td style="font-size:12px;font-family:monospace;">${o.单号 || '-'}</td>
            <td class="highlight-seller">${seller}</td>
            <td class="highlight-buyer">${buyer}</td>
            <td>${Number(o.价格 || 0).toFixed(0)}</td>
            <td class="highlight-profit">${fmt(Number(o.收益 || 0))}</td>
            <td>${fmt(Number(o.上架费 || 0))}</td>
            <td class="text-muted">${o.配单时间 || '-'}</td>
            <td><span class="status-badge ${cls}">${st}</span></td>
        </tr>`;
    }).join('');
}

(async function() {
    const data = await loadData();
    if (!data) return;

    // 默认显示今天
    const today = getTodayStr();
    document.getElementById('datePicker').value = today;
    currentDate = today;
    render(data, today);

    // 事件：日期选择变化
    document.getElementById('datePicker').addEventListener('change', function() {
        const val = this.value;
        currentDate = val || null;
        render(data, currentDate);
    });

    // 事件：点击“今天”
    document.getElementById('todayBtn').addEventListener('click', function() {
        const today = getTodayStr();
        document.getElementById('datePicker').value = today;
        currentDate = today;
        render(data, today);
    });

    // 事件：点击“全部”
    document.getElementById('allBtn').addEventListener('click', function() {
        document.getElementById('datePicker').value = '';
        currentDate = null;
        render(data, null);
    });

    // 事件：搜索
    document.getElementById('searchInput').addEventListener('input', function() {
        render(data, currentDate);
    });
})();
</script>
</body>
</html>
